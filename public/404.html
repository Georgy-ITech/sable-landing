<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Страница не найдена — Sable</title>
    <link rel="icon" type="image/svg+xml" href="/sable-landing/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px; text-align: center;
        padding: 48px 24px; background: #07060c; color: #ecebf5;
        font-family: 'Manrope', system-ui, sans-serif;
      }
      .eyebrow {
        font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: #6366f1;
      }
      h1 {
        font-family: Georgia, 'Cormorant Garamond', serif; font-weight: 500;
        font-size: clamp(4rem, 16vw, 9rem); line-height: 1;
        background: linear-gradient(100deg, #6366f1, #a5a8ff);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      p { color: rgba(236, 235, 245, 0.66); max-width: 44ch; }
      a {
        margin-top: 8px; padding: 14px 28px; border-radius: 999px;
        background: linear-gradient(100deg, #6366f1, #a5a8ff); color: #0a0a16;
        font-weight: 600; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Ошибка 404</p>
    <h1>404</h1>
    <p>Такого аромата в коллекции нет. Возможно, страницу переместили или в адресе опечатка.</p>
    <a href="/sable-landing/">Вернуться на главную</a>
  </body>
</html>
